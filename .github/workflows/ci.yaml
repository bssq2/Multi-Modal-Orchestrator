name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.9"}
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: echo "✅  Syntax OK"