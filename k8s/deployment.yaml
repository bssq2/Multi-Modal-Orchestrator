apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: multimodal-orchestrator:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              nvidia.com/gpu: 1